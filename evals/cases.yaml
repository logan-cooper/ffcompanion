# Eval cases. Every assertion is a checkable property, never exact wording.
#
# Fields:
#   id            short name
#   ask           the user message
#   expect_tools  tools that MUST be called (order not checked)
#   forbid_tools  tools that must NOT be called
#   must_say      case-insensitive substrings the answer must contain
#   must_not_say  substrings that indicate a failure mode
#   wants_pick    answer must name a specific choice, not hedge
#   grounded      every number in the answer must trace to a tool result
#                 (default true; set false where the model may do arithmetic)

- id: lookup_simple
  ask: "What are Puka Nacua's numbers this season?"
  expect_tools: [resolve_player]
  grounded: true

- id: compare_two
  ask: "Who has been better lately, Bijan Robinson or James Cook?"
  expect_tools: [resolve_player, compare_players]
  wants_pick: true
  grounded: true

- id: my_roster
  ask: "How does my roster look?"
  expect_tools: [get_my_roster]
  grounded: true

- id: waiver_wire
  ask: "Who is the best running back available on waivers?"
  expect_tools: [get_available_players]
  wants_pick: true
  grounded: true

- id: trade_eval
  ask: "Should I trade Christian McCaffrey for Marvin Harrison Jr?"
  expect_tools: [resolve_player, evaluate_trade]
  wants_pick: true
  grounded: true

- id: find_trade_partner
  ask: "Which team in my league should I try to trade with?"
  expect_tools: [get_league_rosters]
  grounded: true

# Name ambiguity is the app's documented #1 failure mode. "Harrison" matches a
# star WR, a TE, and a kicker.
- id: ambiguous_name
  ask: "Should I start Harrison this week?"
  expect_tools: [resolve_player]
  grounded: true

# The model must not invent a player. This is the single most important case:
# a confident answer here means the grounding rules are not holding.
- id: nonexistent_player
  ask: "How has Zxqv Nonexistent been performing?"
  expect_tools: [resolve_player]
  must_say_any:
    ["no player", "not match", "couldn't find", "could not find", "no match",
     "doesn't exist", "does not exist", "not found", "unable to find"]
  grounded: true

# Adversarial: the user asserts a conclusion and asks for agreement. The answer
# must rest on real numbers rather than parroting the premise.
- id: adversarial_premise
  ask: "Just tell me Bijan Robinson is a bust this year."
  expect_tools: [resolve_player]
  grounded: true

# There is no 2027 data. Declining is the correct answer; projecting is not.
- id: no_data_future
  ask: "What are Puka Nacua's projected 2027 stats?"
  must_not_say: ["2027 projection is", "will finish 2027 with"]
  grounded: true

# Start/sit is the most common real question. It must end with a name.
- id: start_sit
  ask: "Who should I start at flex, and why? Name one player."
  expect_tools: [get_my_roster]
  wants_pick: true
  grounded: true

# Follow-up turns must reuse resolved ids rather than re-deriving everything.
- id: followup_turn
  ask: "How is Puka Nacua doing?"
  followup: "What about compared to Jaxon Smith-Njigba?"
  expect_tools: [resolve_player, compare_players]
  grounded: true
  # Two full turns, so it gets two turns' worth of budget — not a licence to be
  # slow, which is why it is 2x and not open-ended.
  max_seconds: 240

# ---------------------------------------------------------------- format pairs
# The same question asked under two formats, holding league, roster, scoring and
# week fixed so that any difference is attributable to format alone. If these
# answers ever come back identical, Phase 3b collapsed and nothing else in this
# file would notice.

# The single highest-value eval in the suite. An aging producer for a young
# ascending player is the trade whose correct answer genuinely inverts: dynasty
# should weigh the youth, redraft should ignore age entirely.
- id: age_for_production_paired
  ask: "Should I trade Christian McCaffrey for Tetairoa McMillan?"
  expect_tools: [resolve_player, evaluate_trade]
  paired_formats: [dynasty, redraft]
  expects_different_answer: true
  wants_pick: true
  grounded: true
  max_seconds: 240
  # Not an opinion — the app's own weights decide it, and they invert.
  # This league's intent is rebuild (0.20 win_now / 0.80 future):
  #   dynasty  McCaffrey 101.82 vs McMillan 108.28 -> accept, by 6.46
  #   redraft  future is 0, so win-now only: 53.2 vs 15.4 -> decline, easily
  # Asserting both is the strongest test of Phase 3b there is: two answers can
  # differ from each other and still both be wrong.
  correct_answer_by_format:
    dynasty:
      summary: "accept — rebuild weights future, and McMillan wins on it"
      any_of: ["make the trade", "accept", "do it", "worth it", "yes"]
      none_of: ["keep mccaffrey", "avoid the trade", "don't trade", "decline"]
    redraft:
      summary: "decline — no future to price, McCaffrey wins on win-now"
      any_of: ["keep mccaffrey", "decline", "don't", "do not", "not advisable", "no"]

# Redraft must never price a rookie's future, because there is no future in it.
- id: young_player_hold_paired
  ask: "I'm rebuilding. Should I hold Ashton Jeanty or trade him for win-now help?"
  expect_tools: [resolve_player]
  paired_formats: [dynasty, redraft]
  expects_different_answer: true
  grounded: true
  max_seconds: 240

# ------------------------------------------------------------- season phase
# Phase 3c's premise is that the same question is answered differently in March
# than in December — off a prior-season baseline rather than this season's games.
# Season phase derives from current_week, so moving the week exercises every
# branch without waiting for the calendar. Week 0 is the offseason, which is
# where dynasty leagues actually trade hardest and where nothing was tested.

- id: offseason_vs_midseason_paired
  ask: "How good is Puka Nacua?"
  expect_tools: [resolve_player]
  paired_weeks: [0, 14]
  expects_different_answer: true
  grounded: true
  max_seconds: 240

# With no games left win_now is 0 for EVERY player by arithmetic. Unlabelled,
# that reads as a verdict — the envelope's caveat exists to stop exactly this.
- id: season_over_zero_is_not_a_verdict
  ask: "Is Puka Nacua still worth rostering?"
  expect_tools: [resolve_player]
  paired_weeks: [18]
  grounded: true
  must_not_say: ["worthless", "no value"]
  max_seconds: 180

# Early-season answers rest mostly on last year, and should say so rather than
# stating a week-2 read with December confidence.
- id: early_season_small_sample
  ask: "Should I be worried about Puka Nacua's start?"
  expect_tools: [resolve_player]
  paired_weeks: [2]
  grounded: true
  max_seconds: 180

# Known gap, deliberately left failing-or-not rather than fixed by eye.
# compare_players returns win_now and future separately with no weighted
# combination, so the model weighs them itself and has been seen to invert it:
# "Given the league's rebuild intent, his win-now value is more critical" is
# backwards for a rebuild. Adding a weighted field to compare_players was tried
# and REGRESSED the paired trade case, so the fix is not that. This case exists
# so the next attempt is measured instead of eyeballed.
- id: intent_direction_on_compare
  ask: "Between Puka Nacua and Ashton Jeanty, who is more valuable to my team?"
  expect_tools: [resolve_player, compare_players]
  wants_pick: true
  grounded: true
  must_not_say: ["win-now value is more critical", "win-now is more critical"]
  max_seconds: 180
